<!DOCTYPE html>
<html>
<head>
    <title>Friend's Palette Analysis</title>
    <style>
        body { font-family: monospace; margin: 2rem; }
        .color { display: inline-block; width: 100px; height: 60px; margin: 5px; text-align: center; padding-top: 40px; font-size: 10px; }
    </style>
</head>
<body>
    <h2>Friend's Palette Analysis</h2>
    <div id="analysis"></div>
    
    <script>
        // Friend's exact palette
        const friendsPalette = {
            50: '#F7F6F5',
            100: '#EBE9E6', 
            150: '#DFDCD8',
            200: '#D3CEC9',
            250: '#C7C1BB',
            300: '#BBB5AE',
            350: '#AFA8A0',
            400: '#A49B93',
            450: '#978F86',
            500: '#8C8279',
            550: '#7F776F',
            600: '#736C64',
            650: '#67615A',
            700: '#5B5650',
            750: '#4F4A46',
            800: '#44403D',
            850: '#393633',
            900: '#2D2B29',
            950: '#242321',
            1000: '#1A1918'
        };

        // Convert hex to RGB
        function hexToRgb(hex) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return { r, g, b };
        }

        // Approximate RGB to LAB conversion
        function rgbToLab(r, g, b) {
            // Normalize
            r /= 255; g /= 255; b /= 255;
            
            // Simple approximation for analysis
            const L = (0.299 * r + 0.587 * g + 0.114 * b) * 100;
            const a = (r - g) * 128;
            const bVal = (0.5 * (r + g) - b) * 128;
            
            return { L, a, b: bVal };
        }

        // Calculate chroma
        function getChroma(a, b) {
            return Math.sqrt(a * a + b * b);
        }

        // Analyze each color
        const analysis = [];
        const baseColor = friendsPalette[50]; // #F7F6F5
        const baseLab = rgbToLab(...Object.values(hexToRgb(baseColor)));
        const baseChroma = getChroma(baseLab.a, baseLab.b);

        console.log('=== FRIEND\'S PALETTE ANALYSIS ===');
        console.log(`Base color (50): ${baseColor}`);
        console.log(`Base LAB: L=${baseLab.L.toFixed(1)}, a=${baseLab.a.toFixed(2)}, b=${baseLab.b.toFixed(2)}`);
        console.log(`Base chroma: ${baseChroma.toFixed(2)}`);
        console.log('');

        let html = `<div class="color" style="background: ${baseColor}">${baseColor}<br>BASE</div><br><br>`;

        Object.entries(friendsPalette).forEach(([step, hex]) => {
            const rgb = hexToRgb(hex);
            const lab = rgbToLab(rgb.r, rgb.g, rgb.b);
            const chroma = getChroma(lab.a, lab.b);
            const chromaRatio = chroma / baseChroma;
            
            analysis.push({
                step: parseInt(step),
                hex,
                L: lab.L,
                chroma,
                chromaRatio
            });

            html += `<div class="color" style="background: ${hex}; color: ${parseInt(step) > 500 ? 'white' : 'black'}">${hex}<br>${step}<br>L:${lab.L.toFixed(0)}<br>C:${chroma.toFixed(1)}<br>R:${chromaRatio.toFixed(2)}</div>`;
            
            console.log(`${step}: ${hex} | L=${lab.L.toFixed(1)} | C=${chroma.toFixed(2)} | Ratio=${chromaRatio.toFixed(3)}`);
        });

        document.getElementById('analysis').innerHTML = html;

        // Find the pattern
        console.log('\n=== CHROMA SCALING PATTERN ===');
        const darkColors = analysis.filter(c => c.step >= 500);
        darkColors.forEach(color => {
            const lightnessRatio = color.L / baseLab.L;
            const expectedExponent = Math.log(color.chromaRatio) / Math.log(lightnessRatio);
            console.log(`Step ${color.step}: L ratio=${lightnessRatio.toFixed(3)}, C ratio=${color.chromaRatio.toFixed(3)}, Exponent=${expectedExponent.toFixed(2)}`);
        });
    </script>
</body>
</html>
